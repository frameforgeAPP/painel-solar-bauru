name: SolaX to Firestore Sync

on:
  push:
    branches:
      - master
  schedule:
    # Roda a cada 5 minutos, das 09:00 as 22:55 UTC (06:00 as 19:55 fuso de Brasilia)
    - cron: '*/5 9-22 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub!

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run SolaX Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node github-sync.js
